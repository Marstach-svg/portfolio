<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#0f2744" />
      <stop offset="100%" stop-color="#02081a" />
    </radialGradient>
    <linearGradient id="skin" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)" />
  <g>
    <!-- shoulders -->
    <path d="M 80 400 Q 80 300 200 300 Q 320 300 320 400 Z" fill="#1e3a8a" />
    <!-- neck -->
    <rect x="175" y="240" width="50" height="80" rx="8" fill="url(#skin)" />
    <!-- head -->
    <circle cx="200" cy="180" r="85" fill="url(#skin)" />
    <!-- hair -->
    <path d="M 120 160 Q 130 95 200 95 Q 275 95 280 160 Q 265 125 200 125 Q 140 125 120 160 Z" fill="#111827" />
    <!-- eyes -->
    <ellipse cx="172" cy="185" rx="6" ry="9" fill="#111827" />
    <ellipse cx="228" cy="185" rx="6" ry="9" fill="#111827" />
    <!-- smile -->
    <path d="M 175 220 Q 200 235 225 220" stroke="#7c2d12" stroke-width="3" fill="none" stroke-linecap="round" />
  </g>
  <text x="200" y="390" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#94a3b8" opacity="0.7">PROFILE</text>
</svg>
